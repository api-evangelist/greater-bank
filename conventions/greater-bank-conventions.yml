authentication:
  style: none
  detail: >-
    The public Product Reference Data endpoints are unauthenticated and
    read-only. Authenticated CDR consumer-data sharing (accounts, balances,
    transactions) runs on the accredited-data-recipient OAuth2/OIDC FAPI model
    via the CDR register and is out of scope for this public surface.
  cross_ref: authentication/greater-bank-authentication.yml
