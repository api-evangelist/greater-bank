  style: header
  request_headers: [x-v (required), x-min-v (optional)]
  response_headers: [x-v]
  cross_ref: lifecycle/greater-bank-lifecycle.yml
idempotency:
  supported: false
  detail: >-
    The public surface is GET-only (read-only PRD); there is no
    state-changing/idempotency-key contract to document.
pagination:
  style: page-number
  request_params: [page, page-size]
  defaults: { page: 1, page-size: 25 }
  response_links: [self, first, prev, next, last]   # LinksPaginated
  response_meta: [totalRecords, totalPages]         # MetaPaginated
request_tracing:
  header: x-fapi-interaction-id
  detail: >-
    RFC 4122 UUID correlation id. If supplied it is echoed in the response; if
    omitted the data holder generates one and returns it, per the FAPI profile.
filtering:
  params: [effective (CURRENT/FUTURE/ALL), updated-since, brand, product-category]
