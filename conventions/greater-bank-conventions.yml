cors:
  detail: >-
    Public PRD responses include access-control-allow-origin: * and
    access-control-allow-headers including Range, x-v, x-min-v (confirmed on the
    live endpoint), enabling browser-based data-recipient tooling.
rate_limiting:
  detail: >-
    No public per-bank rate-limit signalling documented; traffic-management
    thresholds fall under the CDR NFRs rather than published response headers.
