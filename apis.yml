  - url: openapi/greater-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right payee endpoints that Greater Bank
    implements as a designated CDR data holder under the DSB Consumer Data Standards CDR
    Banking API. Covers GET /banking/payees (list of the customer's saved payees, with
    pagination) and GET /banking/payees/{payeeId} (payee detail, including domestic,
    international, and BPAY payee sub-schemas). These consumer data endpoints are served
    only over the data holder's authenticated MTLS resource infrastructure via the
    accredited data-recipient (ADR) OAuth2/OpenID Connect FAPI-profile handshake, not on
    the public PRD host. The baseURL reflects the standardized CDS base path; the true
    ResourceBaseUri is Register-issued and not publicly probeable. The referenced OpenAPI
    is the shared DSB CDS standard, not a Greater Bank proprietary specification.
