  humanURL: https://www.greater.com.au/openbanking
  baseURL: https://public.cdr.greater.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.greater.com.au/openbanking
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/greater-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right Product Reference Data (PRD)
    API for Greater Bank, served under the standard CDS base path cds-au/v1/banking/products.
    Confirmed live returning HTTP 200 with an x-v response version of 4 (supported
    versions 4-5) and a data.products array covering transaction accounts, savings
    accounts, term deposits, home loans, personal loans, and credit cards under brand
    "GB" / brandName "Greater Bank". Exposes GET /banking/products (list, with filters
    and pagination) and GET /banking/products/{productId} (detail), each requiring the
    x-v version header. Conforms to the DSB Consumer Data Standards CDR Banking API
    contract; the harvested OpenAPI is the shared CDS standard, not a Greater Bank
    proprietary specification.
