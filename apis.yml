url: https://raw.githubusercontent.com/api-evangelist/greater-bank/refs/heads/main/apis.yml
name: Greater Bank
kind: company
description: Greater Bank is a customer-owned Australian retail bank headquartered in
  Newcastle, New South Wales, offering everyday transaction and savings accounts, term
  deposits, home loans, personal loans, and credit cards to personal and business customers.
  In March 2023 Greater Bank merged with Newcastle Permanent to form Newcastle Greater
  Mutual Group (NGM Group), one of Australia's largest customer-owned mutual banking
  organisations, while continuing to trade under the Greater Bank brand. As an Authorised
  Deposit-taking Institution (ADI) it is a designated data holder under Australia's
  Consumer Data Right (CDR / Open Banking) and exposes a public, unauthenticated Product
  Reference Data (PRD) API conforming to the Data Standards Body (DSB) Consumer Data
  Standards. Consumer-data sharing beyond PRD runs on the accredited CDR data-recipient
  (ADR) model with OAuth2/OpenID Connect FAPI-profile security.
